<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Scene Studio MVP</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,"Microsoft YaHei";background:#101922;color:#eff9fb}header{padding:16px 22px;border-bottom:1px solid #304049;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:20px}.tag{color:#89acb4;font-size:12px}.layout{display:grid;grid-template-columns:345px minmax(0,1fr);height:calc(100vh - 65px)}aside{padding:19px;background:#17252d;overflow:auto;border-right:1px solid #35505a}label{display:block;font-size:12px;color:#a1c3cb;margin:17px 0 7px}textarea,input,select{width:100%;background:#10202a;border:1px solid #3d5b63;border-radius:9px;color:white;padding:10px;font:inherit}textarea{height:115px;resize:vertical}input[type=range]{padding:0;accent-color:#68d3cd}button{border:0;border-radius:9px;padding:11px 14px;background:#52c7bd;color:#062329;font-weight:700;cursor:pointer}button.secondary{background:#324951;color:#dbf3f2}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}button:hover{filter:brightness(1.1)}.tip{color:#8cabb3;font-size:12px;line-height:1.6;margin:16px 0}.stage{position:relative;min-width:0;background:radial-gradient(circle at center,#254452,#101b24 75%)}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:20px;left:20px;padding:10px 15px;border-radius:10px;background:#11262ac9;pointer-events:none;font-size:12px;color:#c4edeb}.hud strong{display:block;font-size:18px;color:white;margin-bottom:4px}.bottom{position:absolute;bottom:17px;left:20px;right:20px;display:flex;gap:8px;flex-wrap:wrap}#message{font-size:12px;color:#aed5d8;min-height:20px}.small{font-size:11px;color:#73989f}@media(max-width:850px){.layout{grid-template-columns:1fr;height:auto}aside{border:0}.stage{height:62vh;min-height:410px}} </style>
</head><body><header><h1>◇ AI Scene Studio <span class="tag">MVP · 模板驱动场景生成</span></h1><span class="tag">Three.js · Interactive Worlds</span></header>
<main class="layout"><aside><label for="prompt">一句话描述场景</label><textarea id="prompt">一个晶莹透明的冰山果冻，内部有企鹅、浮冰和破冰船，海水可以扰动，冰山可以崩解</textarea>
<div class="actions"><button id="generate">✦ 生成场景</button><button class="secondary" id="export">导出 HTML</button></div>
<p class="tip">预设场景使用关键词提取参数，未连接 AI API。支持冰山、企鹅、船、水面；输入“草莓/紫色/蓝色”改变配色，“更多企鹅”“大海浪”等调整配置。</p>
<div class="actions"><button class="secondary" id="undo">撤销</button><button class="secondary" id="redo">重做</button><button class="secondary" id="save">保存场景</button><button class="secondary" id="open">打开场景</button></div><input id="openFile" type="file" accept=".json,application/json" hidden><label>继续修改场景</label><input id="editPrompt" placeholder="例如：改成7只企鹅，蓝莓材质"><div class="actions"><button class="secondary" id="edit">应用文字修改</button><button class="secondary" id="downloadSpec">导出 SceneSpec</button></div><label>材质色彩</label><select id="flavour"><option value="mint">冰川薄荷</option><option value="blue">蓝莓海洋</option><option value="purple">黑莓紫晶</option><option value="pink">草莓果冻</option></select>
<label>企鹅数量 <span id="penguinVal">22</span></label><input id="penguins" type="range" min="0" max="40" value="22">
<label>水面扰动 <span id="waveVal">38</span></label><input id="waves" type="range" min="0" max="100" value="38">
<label>果冻透明度 <span id="glassVal">65</span></label><input id="glass" type="range" min="10" max="95" value="65">
<div class="actions"><button class="secondary" id="calve">❄ 冰山崩解</button><button class="secondary" id="stir">≈ 搅动海面</button><button class="secondary" id="reset">↻ 重置</button></div>
<label>生成状态</label><div id="message" role="status">准备就绪。</div><p class="small">鼠标拖拽旋转视角 · 滚轮缩放 · 点击浮冰使其移动。运行需要联网加载 Three.js CDN。</p>
</aside><section class="stage"><canvas id="world"></canvas><div class="hud"><strong id="sceneTitle">ICEBERG JELLY</strong><span id="meta">企鹅 22 · 浮冰 · Polaris 破冰船</span></div><div class="bottom"><span class="tag">程序化 3D · 基础波面与冰块交互 · 非精密流体模拟</span></div></section></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';
import {planScene,applySceneEdit} from './src/scene-spec.mjs';
import {createHistory} from './src/history.mjs';
const $=id=>document.getElementById(id), canvas=$('world');
const defaults={flavour:'mint',penguins:22,waves:38,glass:65};
let settings=Object.assign({},defaults,window.__INITIAL_SCENE__||{}),currentSpec=window.__EXPORTED_SCENE__||planScene('一个晶莹透明的冰山果冻，22只企鹅，破冰船和浮冰'),history=createHistory(currentSpec),scene,camera,renderer,root,sea,iceGroup,penguinGroup,ship,glass,waterPositions,waterBase,raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),orbit={down:false,x:0,y:0,theta:.55,phi:.95,dist:13},t=0,shock=0,icePieces=[],animationId=0;
const colors={mint:0x63ced1,blue:0x3e9de8,purple:0x9c80d3,pink:0xff8fb0};
function mat(c,rough=.75){return new THREE.MeshStandardMaterial({color:c,roughness:rough})}
function mesh(g,m,parent=root,x=0,y=0,z=0){const a=new THREE.Mesh(g,m);a.position.set(x,y,z);parent.add(a);return a}
function ice(x,y,z,s=1){let p=mesh(new THREE.DodecahedronGeometry(s,1),new THREE.MeshPhysicalMaterial({color:0xd9faff,roughness:.26,metalness:0,transparent:true,opacity:.87,transmission:.17}),iceGroup,x,y,z);p.scale.set(1.18,.7,.95);p.userData.floating=true;p.userData.baseY=y;p.userData.seed=Math.random()*10;icePieces.push(p);return p}
function createPenguin(x,z,size=1){const g=new THREE.Group();g.position.set(x,.81,z);g.scale.setScalar(size);penguinGroup.add(g);mesh(new THREE.SphereGeometry(.115,10,8),mat(0x182a37),g,0,.17,0).scale.set(.8,1.45,.77);mesh(new THREE.SphereGeometry(.087,10,8),mat(0xffffff),g,0,.16,.067).scale.set(.83,1.11,.35);mesh(new THREE.SphereGeometry(.09,10,8),mat(0x1b2c38),g,0,.39,0);mesh(new THREE.ConeGeometry(.043,.10,5),mat(0xffb94b),g,0,.34,.102).rotation.x=Math.PI/2;for(const s of [-1,1]){mesh(new THREE.SphereGeometry(.025,8,6),mat(0xffb94b),g,s*.069,.027,.06);mesh(new THREE.SphereGeometry(.014,7,5),mat(0xffffff),g,s*.037,.40,.075)}g.userData.phase=Math.random()*7;return g}
function makeShip(){ship=new THREE.Group();ship.position.set(.25,.88,.22);root.add(ship);mesh(new THREE.BoxGeometry(.42,.19,.88),mat(0xbc4d42),ship,0,0,0);mesh(new THREE.BoxGeometry(.34,.21,.51),mat(0xe8eee9),ship,0,.18,-.04);mesh(new THREE.BoxGeometry(.23,.16,.24),mat(0x42657b),ship,0,.37,.02);mesh(new THREE.CylinderGeometry(.043,.043,.25,9),mat(0xd3a454),ship,0,.54,-.16);return ship}
function cleanup(){if(root){scene.remove(root);root.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose())}})}}
function build(){
 cleanup();root=new THREE.Group();scene.add(root);
 icePieces=[];glass=null;ship=new THREE.Group();root.add(ship);
 iceGroup=new THREE.Group();root.add(iceGroup);
 penguinGroup=new THREE.Group();root.add(penguinGroup);
 const color=colors[settings.flavour]||colors.mint;
 const place=(g,o)=>{g.position.set(...o.position);if(o.scale)g.scale.set(...o.scale);g.userData.sceneId=o.id;return g};
 const box=(w,h,d,c,g,x=0,y=0,z=0)=>mesh(new THREE.BoxGeometry(w,h,d),mat(c),g,x,y,z);
 const obj=(o)=>{
 const g=new THREE.Group();root.add(g);place(g,o);
 switch(o.type){
 case 'water':{
  root.remove(g);const wg=new THREE.PlaneGeometry(6.4,6.4,56,56);wg.rotateX(-Math.PI/2);
  sea=mesh(wg,new THREE.MeshPhysicalMaterial({color,roughness:.23,metalness:.1,transparent:true,opacity:.77,side:THREE.DoubleSide}),root,...o.position);
  sea.userData.sceneId=o.id;waterPositions=wg.attributes.position;waterBase=Array.from(waterPositions.array);
  break;
 }
 case 'iceberg':{
  mesh(new THREE.ConeGeometry(1.17,2.2,7),mat(0xb9e8ed),g,0,.35,0).rotation.z=.16;
  mesh(new THREE.ConeGeometry(.63,1.4,6),mat(0xe5fbff),g,-.45,.45,-.25);break;
 }
 case 'ice':{
  root.remove(g);const n=Math.max(1,Math.min(40,o.count||1));
  for(let i=0;i<n;i++){const theta=i*2.4,r=.35+Math.sqrt(i)*.42;
    const p=ice(o.position[0]+Math.cos(theta)*r,o.position[1],o.position[2]+Math.sin(theta)*r,.18+(i%3)*.035);
    p.userData.sceneId=o.id;p.userData.instance=i;
  }break;
 }
 case 'penguin':{
  root.remove(g);const n=Math.min(40,o.count??1);
  for(let i=0;i<n;i++){const theta=i*2.39996,r=.12+Math.sqrt((i+.5)/Math.max(1,n))*.79;
   const p=createPenguin(o.position[0]+Math.cos(theta)*r,o.position[2]+Math.sin(theta)*r,.72+(i%5)*.045);
   p.userData.sceneId=o.id;p.position.y=o.position[1];
  }break;
 }
 case 'icebreaker': case 'boat':{
  root.remove(g);makeShip();ship.position.set(...o.position);
  ship.userData.sceneId=o.id;break;
 }
 case 'island':{
  mesh(new THREE.CylinderGeometry(2.2,2.4,.75,12),mat(0x467c64),g);break;
 }
 case 'volcano':{
  mesh(new THREE.ConeGeometry(1.05,2.1,10),mat(0x76544d),g,0,.45,0);
  mesh(new THREE.CylinderGeometry(.26,.26,.06,18),mat(0xff693c),g,0,1.51,0);break;
 }
 case 'tree':{
  mesh(new THREE.CylinderGeometry(.065,.11,.8,8),mat(0x735d46),g,0,.38,0);
  mesh(new THREE.ConeGeometry(.44,.98,9),mat(0x5b9e70),g,0,1.03,0);break;
 }
 case 'animal':{
  mesh(new THREE.SphereGeometry(.24,16,12),mat(0xb6a086),g,0,.2,0);
  mesh(new THREE.SphereGeometry(.14,12,10),mat(0xcab99b),g,0,.32,.23);break;
 }
 case 'jelly':{
  glass=mesh(new THREE.SphereGeometry(1.1,36,24),new THREE.MeshPhysicalMaterial({color,roughness:.13,transparent:true,opacity:.74,transmission:.18}),g);
  glass.scale.y=.78;break;
 }
 case 'press':{
  box(3.5,.25,1.3,0x687c86,g,0,1.25,0);
  for(const x of [-1.55,1.55])box(.18,3,.2,0x87939a,g,x,-.3,0);
  box(2.3,.25,1.4,0xb7c5c9,g,0,-.45,0);break;
 }
 default:root.remove(g);
 }
 };
 // Shared base is not an object inferred by the planner.
 if(currentSpec.kind==='polar'){
  mesh(new THREE.BoxGeometry(6.5,.8,6.5),new THREE.MeshPhysicalMaterial({color,roughness:.14,transparent:true,opacity:settings.glass/130,depthWrite:false}),root,0,.12,0);
  box(6.45,.12,6.45,0x497982,root,0,.48,0);
 }else if(currentSpec.kind==='lab'){box(6.5,.25,6.5,0x566075,root,0,.02,0)}
 for(const o of currentSpec.objects)obj(o);
 // The legacy animation loop expects a wave mesh even in dry scenes.
 if(!sea){const g=new THREE.PlaneGeometry(1,1,1,1);g.rotateX(-Math.PI/2);
 sea=mesh(g,new THREE.MeshBasicMaterial({visible:false}),root,0,-10,0);
 waterPositions=g.attributes.position;waterBase=Array.from(waterPositions.array)}
 $('sceneTitle').textContent=currentSpec.title.toUpperCase();
 $('meta').textContent=currentSpec.objects.length+' 场景对象 · '+currentSpec.kind;
}
function updateInputs(){for(const k of ['flavour','penguins','waves','glass']){$(k).value=settings[k];if($(k+'Val'))$(k+'Val').textContent=settings[k]}}
function specFromText(p){currentSpec=planScene(p,'balanced');return {flavour:currentSpec.environment.palette,penguins:currentSpec.objects.find(o=>o.type==='penguin')?.count||0,waves:currentSpec.environment.waves,glass:currentSpec.environment.transparency}}
function changed(){
 settings.flavour=$('flavour').value;
 for(const k of ['penguins','waves','glass'])settings[k]=+$(k).value;
 currentSpec=JSON.parse(JSON.stringify(currentSpec));
 currentSpec.environment.palette=settings.flavour;
 currentSpec.environment.waves=settings.waves;
 currentSpec.environment.transparency=settings.glass;
 const p=currentSpec.objects.find(o=>o.type==='penguin');
 if(p)p.count=settings.penguins;
 history.push(currentSpec);updateInputs();build();
 $('message').textContent='对象参数已更新并记录到 SceneSpec。';
}
for(const k of ['flavour','penguins','waves','glass'])$(k).addEventListener('input',changed);
function loadSpec(spec){currentSpec=spec;settings={flavour:spec.environment.palette,penguins:spec.objects.find(o=>o.type==='penguin')?.count||0,waves:spec.environment.waves,glass:spec.environment.transparency};updateInputs();build()}
$('generate').onclick=async()=>{try{const prompt=$('prompt').value;let result;try{const resp=await fetch('/api/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt,quality:'balanced'})});if(!resp.ok)throw Error('API unavailable');result=await resp.json();if(result.error)throw Error(result.error)}catch{result={spec:planScene(prompt,'balanced'),mode:'rules'}};loadSpec(result.spec);history.push(currentSpec);$('message').textContent='已生成 '+currentSpec.kind+' 场景（'+result.mode+'）。'}catch(e){$('message').textContent='生成失败：'+e.message}};
$('edit').onclick=()=>{try{currentSpec=applySceneEdit(currentSpec,$('editPrompt').value);settings.flavour=currentSpec.environment.palette;settings.waves=currentSpec.environment.waves;settings.penguins=currentSpec.objects.find(o=>o.type==='penguin')?.count||0;updateInputs();build();history.push(currentSpec);$('message').textContent='已应用文字修改'}catch(e){$('message').textContent=e.message}};
$('undo').onclick=()=>{loadSpec(history.undo());$('message').textContent='已撤销'};
$('redo').onclick=()=>{loadSpec(history.redo());$('message').textContent='已重做'};
$('save').onclick=()=>{const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(currentSpec,null,2)],{type:'application/json'}));a.href=url;a.download='scene-project.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('open').onclick=()=>$('openFile').click();
$('openFile').onchange=async e=>{try{const raw=JSON.parse(await e.target.files[0].text());const {validateScene}=await import('./src/scene-spec.mjs');loadSpec(validateScene(raw));history.push(currentSpec);$('message').textContent='项目已加载'}catch(err){$('message').textContent='导入失败：'+err.message}};
$('downloadSpec').onclick=()=>{const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(currentSpec,null,2)],{type:'application/json'}));a.href=url;a.download='scene-spec.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('calve').onclick=()=>{if(!currentSpec.objects.some(o=>o.type==='iceberg')){$('message').textContent='该场景没有冰山对象';return;}for(let i=0;i<4;i++){let p=ice(-1.3+Math.random()*.7,1.4+Math.random(),-1.1+Math.random()*.6,.14+Math.random()*.12);p.userData.falling=true;p.userData.speed=0}shock=1.3;$('message').textContent='冰川已崩解，新浮冰正在下落。'};
$('stir').onclick=()=>{shock=1.8;$('message').textContent='已激发水面波动。'};
$('reset').onclick=()=>{currentSpec=planScene('冰山果冻，企鹅，破冰船');settings=Object.assign({},defaults);updateInputs();build();shock=0;$('message').textContent='已恢复默认场景。'};
$('export').onclick=async()=>{try{
 const plannerSource=await fetch('./src/scene-spec.mjs').then(r=>{if(!r.ok)throw Error('SceneSpec 文件无法读取');return r.text()});
 const historySource=await fetch('./src/history.mjs').then(r=>r.text());
 let source='<!doctype html>\n'+document.documentElement.outerHTML;
 source=source.replace(/<script\s+id="export-state"[\s\S]*?<\/script>/g,'');
 const json=JSON.stringify(settings).replace(/</g,'\\u003c');
 const sceneJson=JSON.stringify(currentSpec).replace(/</g,'\\u003c');
 source=source.replace('<script type="module">','<script id="export-state">window.__INITIAL_SCENE__='+json+';window.__EXPORTED_SCENE__='+sceneJson+';<\/script><script type="module">');
 source=source.replace("import {planScene,applySceneEdit} from './src/scene-spec.mjs';",plannerSource.replace(/\bexport\s+(?=(const|function|class)\b)/g,''));
 source=source.replace("import {createHistory} from './src/history.mjs';",historySource.replace(/\bexport\s+(?=(const|function|class)\b)/g,''));
 const u=URL.createObjectURL(new Blob([source],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='ai-scene-studio-export.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);
 $('message').textContent='已导出 HTML：SceneSpec 内嵌，仍需联网加载 Three.js。';
 }catch(err){$('message').textContent='导出失败：'+err.message}};
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x19313f);scene.fog=new THREE.Fog(0x19313f,17,29);camera=new THREE.PerspectiveCamera(42,1,.1,120);renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;scene.add(new THREE.HemisphereLight(0xe9fbff,0x547b84,2.3));const light=new THREE.DirectionalLight(0xffffff,3.1);light.position.set(-4,9,6);scene.add(light);updateInputs();loadSpec(currentSpec);animate()}
function animate(){animationId=requestAnimationFrame(animate);const rect=canvas.getBoundingClientRect();if(renderer.domElement.width!==Math.floor(rect.width*renderer.getPixelRatio())||renderer.domElement.height!==Math.floor(rect.height*renderer.getPixelRatio())){renderer.setSize(rect.width,rect.height,false);camera.aspect=rect.width/Math.max(1,rect.height);camera.updateProjectionMatrix()}t+=.016;shock*=.975;let amplitude=(settings.waves/100)*.075+shock*.11;const ar=waterPositions.array;for(let i=0;i<ar.length;i+=3){let x=waterBase[i],z=waterBase[i+2];ar[i+1]=Math.sin(x*3.1+t*2.4)*Math.cos(z*3.7+t*1.7)*amplitude+Math.sin(z*5-t*3)*amplitude*.26}waterPositions.needsUpdate=true;sea.geometry.computeVertexNormals();for(const p of icePieces){if(p.userData.falling){p.userData.speed+=.008;p.position.y-=p.userData.speed;if(p.position.y<=.85){p.position.y=.85;p.userData.falling=false;p.userData.baseY=.85;shock=Math.max(shock,.48)}}else p.position.y=p.userData.baseY+Math.sin(t*1.7+p.userData.seed)*.045;p.rotation.z=Math.sin(t+p.userData.seed)*.055}
penguinGroup.children.forEach(p=>{p.rotation.y=Math.sin(t*.6+p.userData.phase)*.48;p.position.y=.81+Math.sin(t*2+p.userData.phase)*.012});if(currentSpec.kind==='polar'){ship.position.x=.25+Math.sin(t*.34)*1.5;ship.position.z=.22+Math.cos(t*.34)*.68;ship.rotation.y=Math.cos(t*.34)*.35;ship.rotation.z=Math.sin(t*2)*.027;}else if(currentSpec.kind==='volcano'){ship.position.x=1.6+Math.sin(t*.34)*.3;}else if(glass){glass.scale.y=.78+Math.sin(t*2)*.035;}camera.position.set(Math.sin(orbit.theta)*orbit.dist*Math.sin(orbit.phi),Math.cos(orbit.phi)*orbit.dist,Math.cos(orbit.theta)*orbit.dist*Math.sin(orbit.phi));camera.lookAt(0,.8,0);renderer.render(scene,camera)}
canvas.addEventListener('pointerdown',e=>{orbit.down=true;orbit.x=e.clientX;orbit.y=e.clientY;canvas.setPointerCapture(e.pointerId);const r=canvas.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(iceGroup.children);if(hits.length){hits[0].object.position.x+=(Math.random()-.5)*.8;hits[0].object.position.z+=(Math.random()-.5)*.8;shock=.4}else shock=Math.max(shock,.24)});
canvas.addEventListener('pointermove',e=>{if(!orbit.down)return;orbit.theta-=(e.clientX-orbit.x)*.006;orbit.phi=Math.max(.30,Math.min(1.48,orbit.phi+(e.clientY-orbit.y)*.005));orbit.x=e.clientX;orbit.y=e.clientY});canvas.addEventListener('pointerup',()=>orbit.down=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();orbit.dist=Math.max(6.5,Math.min(24,orbit.dist+e.deltaY*.013))},{passive:false});
try{init()}catch(e){$('message').textContent='WebGL 初始化失败：'+e.message;console.error(e)}
</script></body></html>
