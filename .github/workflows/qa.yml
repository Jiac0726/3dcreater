name: Scene Studio QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  unit-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser and export tests
        run: npm run test:e2e
      - name: Preserve browser screenshots and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-studio-qa
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
